<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Smart AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>Pocket Smart AI 🤖</h1>
    
    <div id="chat-box" class="chat-box">
      <div class="message ai-message">ஹலோ! நான் உங்களோட Pocket Smart AI. என்ன கேள்வி வேணா கேளுங்க!</div>
    </div>

    <div class="input-container">
      <input type="text" id="user-input" placeholder="இங்கே டைப் செய்யவும்...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
